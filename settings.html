<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — Invoice Generator</title>
    <meta name="description" content="Configure company details, bank information, and document defaults.">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Immediate Authentication Check -->
    <script src="js/auth.js"></script>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-receipt-cutoff"></i> Invoice &amp; Quotation
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto align-items-md-center">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="bi bi-plus-circle"></i> Create</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="settings.html"><i class="bi bi-gear"></i> Settings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-logout" href="javascript:void(0)" onclick="Auth.logout()" title="Logout"><i
                                class="bi bi-box-arrow-right"></i> Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-3">

        <div class="page-header">
            <h4><i class="bi bi-gear"></i> Settings</h4>
        </div>

        <form id="settingsForm" autocomplete="off">

            <!-- Company Information -->
            <div class="card mb-3">
                <div class="card-header"><i class="bi bi-building me-1"></i> Company Information</div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label" for="companyName">Company Name *</label>
                            <input type="text" class="form-control" id="companyName"
                                placeholder="e.g. Apex Global Solutions Ltd." required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="pan">PAN Number</label>
                            <input type="text" class="form-control" id="pan" placeholder="e.g. ABCDE1234F">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="mobile">Mobile Number(s) *</label>
                            <input type="text" class="form-control" id="mobile"
                                placeholder="e.g. +91 98765 43210, +91 98765 43211" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="email">Email Address *</label>
                            <input type="email" class="form-control" id="email"
                                placeholder="e.g. billing@apexsolutions.com" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="website">Website</label>
                            <input type="url" class="form-control" id="website"
                                placeholder="e.g. https://www.apexsolutions.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Company Logo</label>
                            <div class="upload-area" onclick="document.getElementById('logoInput').click()">
                                <i class="bi bi-image"></i>
                                <p>Click to upload logo</p>
                                <input type="file" id="logoInput" accept="image/*" class="d-none">
                            </div>
                            <div id="logoPreview" class="image-preview"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bank Details -->
            <div class="card mb-3">
                <div class="card-header"><i class="bi bi-bank me-1"></i> Bank Details</div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label" for="bankName">Bank Name *</label>
                            <input type="text" class="form-control" id="bankName" placeholder="e.g. State Bank of India"
                                required>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label" for="accountHolder">Account Holder *</label>
                            <input type="text" class="form-control" id="accountHolder"
                                placeholder="e.g. Apex Global Solutions Ltd." required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="accountNumber">Account Number *</label>
                            <input type="text" class="form-control" id="accountNumber" placeholder="e.g. 102938475610"
                                required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="ifscCode">IFSC Code *</label>
                            <input type="text" class="form-control" id="ifscCode" placeholder="e.g. SBIN0001234"
                                required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="branch">Branch *</label>
                            <input type="text" class="form-control" id="branch" placeholder="e.g. Nariman Point, Mumbai"
                                required>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Document Footer -->
            <div class="card mb-3">
                <div class="card-header"><i class="bi bi-file-earmark-check me-1"></i> Document Footer</div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">UPI QR Code <span
                                    class="text-muted fw-normal">(optional)</span></label>
                            <div class="upload-area" onclick="document.getElementById('qrInput').click()">
                                <i class="bi bi-qr-code"></i>
                                <p>Click to upload QR code</p>
                                <input type="file" id="qrInput" accept="image/*" class="d-none">
                            </div>
                            <div id="qrPreview" class="image-preview"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Authorized Signature</label>
                            <div class="upload-area" onclick="document.getElementById('signatureInput').click()">
                                <i class="bi bi-pen"></i>
                                <p>Click to upload signature image</p>
                                <input type="file" id="signatureInput" accept="image/*" class="d-none">
                            </div>
                            <div id="signaturePreview" class="image-preview"></div>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="defaultNotes">Default Notes</label>
                            <textarea class="form-control" id="defaultNotes" rows="4"
                                placeholder="e.g. 1. Payment due within 15 days of invoice date.&#10;2. Goods once delivered are covered under 1-year warranty.&#10;3. Please cite quotation ID on payment."></textarea>
                            <div class="form-text">Use separate lines for each note. They will be shown as-is on the
                                document.</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Save button -->
            <button type="submit" class="btn btn-primary mb-4">
                <i class="bi bi-check-lg"></i> Save Settings
            </button>
        </form>
    </div>

    <!-- Toast container -->
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="js/utils.js"></script>
    <script src="js/settings.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
